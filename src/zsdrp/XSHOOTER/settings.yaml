__instrument__: XSHOOTER
__inherits__: defaults/settings.json
bias:
  degree: 0
flat:
  bias_scaling: number_of_files
  plot: false
trace:
  degree: 4
  filter_type: boxcar
  filter_y: 9
  filter_x: 9
  min_cluster: 500
  min_width: 0.1
  noise: 2
  noise_relative: 0
  border_width: 0
  manual: false
  plot: false
norm_flat:
  extraction_height: 0.8
  threshold: 100
  plot: false
curvature:
  dimensionality: 2D
  curve_degree: 2
  degree: [2, 2]
  curve_height: 0.8
  extraction_height: 5
  peak_width: 1
  peak_threshold: 10
  plot: false
science:
  maxiter: 100  # Allow faint slit profiles to reach the unchanged convergence criterion.
  bias_scaling: number_of_files
  extraction_height: 10
  smooth_slitfunction: 0.1
  smooth_spectrum: 0.0000001
  oversampling: 10
  swath_width: 300
  plot: false
