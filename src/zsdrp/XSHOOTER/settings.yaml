__instrument__: XSHOOTER
__inherits__: defaults/settings.json
bias:
  degree: 0
flat:
  bias_scaling: number_of_files
  plot: false
trace:
  degree: 4
  filter_type: boxcar
  filter_y: 9
  filter_x: 9
  min_cluster: 500
  min_width: 0.1
  noise: 2
  noise_relative: 0
  border_width: 0
  manual: false
  plot: false
norm_flat:
  extraction_height: 60  # Central 9.6 arcsec of the 11 arcsec CCD slit.
  threshold: 100
  plot: false
curvature:
  dimensionality: 2D
  curve_degree: 2
  degree: [2, 2]
  curve_height: 40  # Fit illuminated slit rows, not a fraction of inter-order spacing.
  extraction_height: 5
  peak_width: 1
  peak_threshold: 10
  plot: false
science:
  maxiter: 1000  # A cap: converged slit profiles stop early at the unchanged tolerance.
  bias_scaling: number_of_files
  extraction_height: 10
  smooth_slitfunction: 0.1
  smooth_spectrum: 0.0000001
  oversampling: 10
  swath_width: 300
  plot: false
