# Measured tracing of the 2 arcsec illuminated-slit frames. The untapered
# CCD response extends orders that the SPEC full-slit-flat settings merge.
BLUE:
  filter_type: boxcar
  filter_y: 31
  filter_x: 15
  noise: 30
  noise_relative: 0
  min_cluster: 1500
  min_width: 0.2
  border_width: 0
  closing_shape: [1, 3]
GREEN: &short_trace
  filter_type: boxcar
  filter_y: 21
  filter_x: 9
  noise: 30
  noise_relative: 0
  min_cluster: 1000
  min_width: 0.1
  border_width: 0
  closing_shape: [1, 2]
RED: *short_trace
YJ: {}  # The LmAPD detector and its existing short-slit tracing are unchanged.
H: *short_trace
K: *short_trace
