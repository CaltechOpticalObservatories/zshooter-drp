__instrument__: ZSHOOTER
__inherits__: defaults/settings.json

bias:
  degree: 0

flat:
  bias_scaling: exposure_time
  plot: False

trace:
  degree: 4
  bias_scaling: exposure_time
  filter_y: 1
  filter_type: whittaker
  min_cluster: 15000
  noise_relative: 0.001
  border_width: [30, 20, 200, 150]
  auto_merge_threshold: 0.9
  merge_min_threshold: 0.1
  manual: false
  min_width: 0.2
  split_sigma: 4

scatter:
  bias_scaling: exposure_time
  extraction_height: 0.9
  border_width: 20

norm_flat:
  smooth_slitfunction: 2
  extraction_height: 0.9
  oversampling: 10
  swath_width: 200
  threshold: 1000
  maxiter: 30

curvature:
  bias_scaling: exposure_time
  dimensionality: 2D
  curve_degree: 1
  curve_height: 0.9
  extraction_height: 1
  degree:
    - 1
    - 1

wavecal_master:
  extraction_method: simple
  bias_scaling: exposure_time

wavecal:
  threshold: 200
  iterations: 3
  dimensionality: 2D
  degree:
    - 7
    - 8
  manual: false
  shift_window: 0

freq_comb_master:
  bias_scaling: exposure_time

freq_comb:
  dimensionality: 2D
  degree:
    - 6
    - 6

trace_sci:
  degree: 4
  bias_scaling: exposure_time
  filter_y: 10
  filter_x: 10
  filter_type: gaussian
  min_cluster: 5000
  noise_relative: 0.001
  border_width: 30
  auto_merge_threshold: 0.9
  merge_min_threshold: 0.1
  manual: false
  min_width: 0.2
  split_sigma: 6

science:
  bias_scaling: exposure_time
  oversampling: 10
  extraction_height: 1
  swath_width: 1000
  smooth_slitfunction: 2
  smooth_spectrum: 0
  maxiter: 5