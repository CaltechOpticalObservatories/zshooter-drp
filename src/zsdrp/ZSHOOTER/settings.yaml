__instrument__: ZSHOOTER
__inherits__: defaults/settings.json

bias:
  degree: 0

flat:
  bias_scaling: exposure_time
  plot: False

trace:
  degree: 4
  bias_scaling: exposure_time
  filter_y: 20
  filter_type: whittaker
  min_cluster: 20000
  noise_relative: 0.001
  border_width: 0
  manual: false
  min_width: 0.5
  split_sigma: 5
  plot: True

#scatter:
#  bias_scaling: exposure_time
#  extraction_height: 0.9
#  border_width: 20

norm_flat:
  extraction_height: 50
  threshold: 100
  plot: False

curvature:
  dimensionality: 1D  # pyreduce returns no fitted_coeffs (so no trace.slit) in 2D mode
  curve_degree: 1
  degree: 0  # the model tilt is the detector rotation, constant along each order; higher degrees overfit sparse IR orders
  curve_height: 50  # rows sampled across the ~64 px slit image; must be several extraction_height to measure a tilt
  extraction_height: 5
  peak_width: 1
  peak_threshold: 50  # x 68th percentile of the order spectrum; at 10 noise peaks in sparse orders (YJ, H, K, RED) set the tilt, at >=300 real lines are lost
  plot: False

wavecal_master:
  extraction_method: simple
  extraction_height: 10
  plot: False

wavecal_init:
  atlas: "thar"
  medium: 'air'
#  resid_delta: 2000
#  smoothing: 1
  edge_margin: 0
  wave_delta: 5
  cutoff: 0.01
  match_tolerance: 1.0
  plot: True

wavecal:
  atlas: "thar"
  medium: 'air'
  threshold: 200
  dimensionality: 1D
  shift_window: 0.0
  nstep: 0
  degree: 3
  plot: True

science:
#  bias_scaling: exposure_time
#  oversampling: 10
  extraction_height: 10
#  swath_width: 200
#  smooth_slitfunction: 2
#  smooth_spectrum: 0.1
#  maxiter: 5
  plot: True